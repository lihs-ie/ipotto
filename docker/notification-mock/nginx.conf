server {
    listen 80;
    access_log /var/log/nginx/access.log;

    # SendGrid v3 Mail Send — returns 202 Accepted like the real API.
    location /sendgrid/mail/send {
        return 202;
    }

    # LINE Notify — returns 200 OK on a successful send.
    location /line/api/notify {
        return 200;
    }

    # Slack incoming webhooks — always return 200 for any /slack/* URL
    # since Slack webhook URLs carry a service/channel/token path that
    # the domain adapter composes at request time.
    location /slack/ {
        return 200;
    }

    # Anything else — catch misconfiguration early.
    location / {
        return 404;
    }
}
