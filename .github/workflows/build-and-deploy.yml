name: Build and Deploy

on:
  push:
    branches: [main]

env:
  GCP_REGION: asia-northeast1
  AR_REGISTRY: asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/ipotto

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ipo-api:
              - 'services/ipo-api/**'
              - 'services/ipo-backend-shared/**'
            ipo-browser:
              - 'services/ipo-browser/**'
              - 'services/ipo-frontend-shared/**'
            ipo-info-fetcher:
              - 'services/ipo-info-fetcher/**'
              - 'services/ipo-backend-shared/**'
            ipo-result-checker:
              - 'services/ipo-result-checker/**'
              - 'services/ipo-backend-shared/**'
            ipo-frontend:
              - 'services/ipo-frontend/**'
              - 'services/ipo-frontend-shared/**'

  build-deploy:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev
      - name: Build and push
        run: |
          IMAGE="${{ env.AR_REGISTRY }}/${{ matrix.service }}:${{ github.sha }}"
          docker build -t "$IMAGE" -f "services/${{ matrix.service }}/Dockerfile" services
          docker push "$IMAGE"
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ matrix.service }}" \
            --image "${{ env.AR_REGISTRY }}/${{ matrix.service }}:${{ github.sha }}" \
            --region "${{ env.GCP_REGION }}" \
            --quiet
