name: Terraform CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TERRAFORM_VERSION: "1.14.8"

jobs:
  detect-terraform-changes:
    name: Detect Terraform Changes
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect terraform diff
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" | grep -q '^terraform/'; then
            echo "has_changes=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "has_changes=false" >> "${GITHUB_OUTPUT}"

  terraform-format:
    name: Terraform Format
    runs-on: ubuntu-latest
    needs: detect-terraform-changes
    if: needs.detect-terraform-changes.outputs.has_changes == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Check format
        run: terraform fmt -check -recursive terraform

  terraform-validate:
    name: Terraform Validate (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs:
      - detect-terraform-changes
      - terraform-format
    if: needs.detect-terraform-changes.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        environment: [stg, prd]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform init (backend disabled)
        run: terraform -chdir=terraform/environments/${{ matrix.environment }} init -backend=false -input=false -lockfile=readonly

      - name: Terraform validate
        run: terraform -chdir=terraform/environments/${{ matrix.environment }} validate

  terraform-plan:
    name: Terraform Plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs:
      - detect-terraform-changes
      - terraform-validate
    if: needs.detect-terraform-changes.outputs.has_changes == 'true'
    environment: ${{ matrix.github_environment }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: stg
            github_environment: STG
          - environment: prd
            github_environment: PRD
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Check plan credentials
        id: credentials
        env:
          WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail

          if [ -n "${WIF_PROVIDER}" ] && [ -n "${WIF_SERVICE_ACCOUNT}" ]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "available=false" >> "${GITHUB_OUTPUT}"

      - name: Authenticate to Google Cloud
        if: github.event.pull_request.head.repo.full_name == github.repository && steps.credentials.outputs.available == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Terraform init
        if: github.event.pull_request.head.repo.full_name == github.repository && steps.credentials.outputs.available == 'true'
        run: terraform -chdir=terraform/environments/${{ matrix.environment }} init -input=false -lockfile=readonly -reconfigure

      - name: Terraform plan
        id: plan
        if: github.event.pull_request.head.repo.full_name == github.repository && steps.credentials.outputs.available == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          terraform -chdir=terraform/environments/${{ matrix.environment }} plan -input=false -lock-timeout=300s -no-color -out=tfplan

      - name: Render plan
        if: github.event.pull_request.head.repo.full_name == github.repository && steps.credentials.outputs.available == 'true' && steps.plan.outcome == 'success'
        run: terraform -chdir=terraform/environments/${{ matrix.environment }} show -no-color tfplan > terraform/environments/${{ matrix.environment }}/tfplan.txt

      - name: Upload plan artifact
        if: github.event.pull_request.head.repo.full_name == github.repository && steps.credentials.outputs.available == 'true' && steps.plan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ matrix.environment }}
          path: terraform/environments/${{ matrix.environment }}/tfplan.txt
          retention-days: 7

      - name: Write plan summary
        if: github.event.pull_request.head.repo.full_name == github.repository && steps.credentials.outputs.available == 'true' && (success() || failure())
        run: |
          {
            echo "## Terraform Plan"
            echo "- Environment: \`${{ matrix.environment }}\`"
            echo "- Result: \`${{ steps.plan.outcome }}\`"
            echo "- Artifact: \`terraform-plan-${{ matrix.environment }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Fail on plan error
        if: github.event.pull_request.head.repo.full_name == github.repository && steps.credentials.outputs.available == 'true' && steps.plan.outcome != 'success'
        run: exit 1

      - name: Write missing credentials summary
        if: github.event.pull_request.head.repo.full_name == github.repository && steps.credentials.outputs.available != 'true'
        run: |
          {
            echo "## Terraform Plan"
            echo "- Environment: \`${{ matrix.environment }}\`"
            echo "- Result: \`skipped\`"
            echo "- Reason: GitHub Environment に \`WIF_PROVIDER\` または \`WIF_SERVICE_ACCOUNT\` が未設定のため plan を実行しません。"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Write fork summary
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          {
            echo "## Terraform Plan"
            echo "- Environment: \`${{ matrix.environment }}\`"
            echo "- Result: \`skipped\`"
            echo "- Reason: fork からの PR では認証情報を使わないため plan を実行しません。"
          } >> "${GITHUB_STEP_SUMMARY}"

  terraform-ci-gate:
    name: Terraform CI Gate
    runs-on: ubuntu-latest
    if: success() || failure()
    needs:
      - detect-terraform-changes
      - terraform-format
      - terraform-validate
      - terraform-plan
    steps:
      - name: Evaluate workflow result
        env:
          HAS_CHANGES: ${{ needs.detect-terraform-changes.outputs.has_changes }}
          FORMAT_RESULT: ${{ needs.terraform-format.result }}
          VALIDATE_RESULT: ${{ needs.terraform-validate.result }}
          PLAN_RESULT: ${{ needs.terraform-plan.result }}
        run: |
          set -euo pipefail
          {
            echo "## Terraform CI Gate"
            echo "- Terraform changed: \`${HAS_CHANGES}\`"
            echo "- Format: \`${FORMAT_RESULT}\`"
            echo "- Validate: \`${VALIDATE_RESULT}\`"
            echo "- Plan: \`${PLAN_RESULT}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${HAS_CHANGES}" != "true" ]; then
            exit 0
          fi

          for result in "${FORMAT_RESULT}" "${VALIDATE_RESULT}" "${PLAN_RESULT}"; do
            if [ "${result}" != "success" ]; then
              exit 1
            fi
          done
