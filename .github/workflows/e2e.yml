name: E2E Tests

on:
  pull_request:
    branches: [main, develop]

jobs:
  e2e-browser:
    name: E2E - ipo-browser (HTML Mock)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Start test infrastructure
        run: |
          docker compose up -d \
            html-mock-server \
            ipo-browser
          docker compose ps

      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8081/health > /dev/null 2>&1 && \
               curl -sf http://localhost:8090/ > /dev/null 2>&1; then
              echo "Services ready"
              exit 0
            fi
            echo "Waiting for services... ($i/30)"
            sleep 2
          done
          echo "Services failed to start"
          docker compose logs
          exit 1

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: services/ipo-browser/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: services/ipo-browser/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: services/ipo-browser
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: services/ipo-browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: services/ipo-browser
        run: pnpm e2e
        env:
          CI: true
          MOCK_SERVER_URL: http://localhost:8090
          IPO_BROWSER_URL: http://localhost:8081

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-results
          path: services/ipo-browser/test-results/
          retention-days: 7

      - name: Stop infrastructure
        if: success() || failure()
        run: docker compose down

  e2e-frontend:
    name: E2E - ipo-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Start test infrastructure
        run: |
          docker compose up -d \
            firebase-emulator \
            ipo-api \
            ipo-frontend
          docker compose ps

      - name: Wait for services
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Frontend ready"
              exit 0
            fi
            echo "Waiting for frontend... ($i/60)"
            sleep 2
          done
          echo "Frontend failed to start"
          docker compose logs
          exit 1

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: services/ipo-frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: services/ipo-frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: services/ipo-frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: services/ipo-frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: services/ipo-frontend
        run: pnpm e2e
        env:
          CI: true
          FRONTEND_URL: http://localhost:3000

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-results
          path: services/ipo-frontend/test-results/
          retention-days: 7

      - name: Stop infrastructure
        if: success() || failure()
        run: docker compose down
