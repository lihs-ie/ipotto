[package]
name = "ipo-result-checker"
version = "0.1.0"
edition = "2021"

[dependencies]
ipo-backend-shared = { path = "../ipo-backend-shared" }
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
reqwest = { version = "0.13", features = ["json"] }

[dev-dependencies]
ipo-backend-shared = { path = "../ipo-backend-shared", features = ["test-support"] }
tower = "0.5"
wiremock = "0.6"
uuid = { version = "1", features = ["v4"] }
