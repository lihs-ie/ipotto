[package]
name = "ipo-backend-shared"
version = "0.1.0"
edition = "2021"

[features]
# Enables in-memory test doubles (FirestoreXxxRepositoryInMemory,
# PubSubEventPublisher, InMemoryCredentialStore) so downstream crates
# can build test harnesses without pulling production Firestore /
# Pub/Sub clients into their test binaries. Production code paths do
# not rely on this feature.
test-support = []

[dependencies]
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
firestore = "0.48"
rand = "0.8"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
ulid = { version = "1", features = ["serde"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"
