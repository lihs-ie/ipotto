[package]
name = "ipo-api"
version = "0.1.0"
edition = "2021"

[dependencies]
ipo-backend-shared = { path = "../ipo-backend-shared" }
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1", features = ["full", "sync"] }
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
ulid = "1"

[dev-dependencies]
ipo-backend-shared = { path = "../ipo-backend-shared", features = ["test-support"] }
rand = "0.8"
rsa = { version = "0.9", features = ["pem"] }
tower = "0.5"
wiremock = "0.6"
