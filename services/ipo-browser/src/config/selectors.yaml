# Broker-specific DOM selectors consumed by the Playwright flows.
# Phase 3 Sprint 5.3 — externalized so operators can rotate selectors
# without shipping a new binary when Rakuten changes their markup.
# Fallback arrays are tried left-to-right; the primary selector is
# the `primary` key.
rakuten:
  login:
    loginIdInput:
      primary: "#loginid"
      fallback:
        - "input[name='loginid']"
        - "input[type='text']:nth-of-type(1)"
    passwordInput:
      primary: "#passwd"
      fallback:
        - "input[name='passwd']"
        - "input[type='password']"
    submitButton:
      primary: "button[type='submit']"
      fallback:
        - "form#login-form button"
        - "button:has-text('ログイン')"

  # Phase 3 Sprint 6 — 2FA 画像認証画面 (image auth) の DOM 構造。
  # 実画面は alt 属性付きの画像ボタンが複数並び、メールで届く
  # "keyword1 + keyword2" のキーワードに対応する 2 つのボタンを順に
  # クリックして送信する形式。
  imageAuthentication:
    container:
      primary: "#image-auth-container"
      fallback:
        - "main div:has(button img[alt])"
    imageButtons:
      primary: "#image-buttons button"
      fallback:
        - "button:has(img[alt])"
    imageElement:
      primary: "img[alt]"
    submitButton:
      primary: "#submit-button"
      fallback:
        - "button[type='submit']"
        - "button:has-text('確認')"
    successIndicator:
      primary: "#auth-success"
      fallback:
        - "[class*='success']"
    errorMessage:
      primary: "#auth-error"
      fallback:
        - "[class*='error']"
