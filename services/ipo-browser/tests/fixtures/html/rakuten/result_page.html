<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>楽天証券 IPO 抽選結果</title>
</head>
<body>
  <h1>IPO 抽選結果</h1>
  <table id="lottery-results">
    <thead>
      <tr>
        <th>企業名</th>
        <th>ステータス</th>
      </tr>
    </thead>
    <tbody>
      <tr
        data-stock-identifier="01HA1234567890ABCDEFGHJKMN"
        data-company-name="テスト第一株式会社"
      >
        <td>テスト第一株式会社</td>
        <td class="result-label">当選</td>
      </tr>
      <tr
        data-stock-identifier="01HB1234567890ABCDEFGHJKMN"
        data-company-name="テスト第二株式会社"
      >
        <td>テスト第二株式会社</td>
        <td class="result-label">落選</td>
      </tr>
      <tr
        data-stock-identifier="01HC1234567890ABCDEFGHJKMN"
        data-company-name="テスト第三株式会社"
      >
        <td>テスト第三株式会社</td>
        <td class="result-label">補欠</td>
      </tr>
      <tr
        data-stock-identifier="01HD1234567890ABCDEFGHJKMN"
        data-company-name="テスト第四株式会社"
      >
        <td>テスト第四株式会社</td>
        <td class="result-label">未発表</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
