pre-commit:
  parallel: true
  commands:
    rust-fmt:
      root: services/
      glob: "**/*.rs"
      run: cargo fmt --all -- --check
    browser-lint:
      root: services/ipo-browser/
      glob: "**/*.{ts,js}"
      run: pnpm lint
    frontend-lint:
      root: services/ipo-frontend/
      glob: "**/*.{ts,tsx,js}"
      run: pnpm lint

pre-push:
  commands:
    ci:
      run: make ci
